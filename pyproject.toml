[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "create-mlops-project-skill"
version = "0.1.0"
description = "Validation utilities for the create-mlops-project Codex plugin."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
    "hypothesis>=6.138,<7",
    "mypy>=2.3.1,<2.4",
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.2,<8",
    "pytest-timeout>=2.4,<3",
    "ruff>=0.16.5,<0.17",
    "types-pyyaml>=6.0.12,<7",
]
mutation = [
    "mutmut>=3.3,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["skills/create-mlops-project/scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100
preview = false
extend-exclude = [".pytest-tmp"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "ANN", "ASYNC", "BLE", "C4",
    "DTZ", "EM", "ERA", "EXE", "FA", "FLY", "FURB", "G", "ICN", "INP", "INT",
    "LOG", "PIE", "PT", "PTH", "Q", "RET", "RSE", "S", "SIM", "SLOT", "T10",
    "T20", "TC", "ARG", "PERF", "PGH", "PLC", "PLE", "PLW", "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"skills/create-mlops-project/scripts/validate_project.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.mypy]
python_version = "3.12"
files = ["skills/create-mlops-project/scripts", "tests"]
strict = true
warn_unused_configs = true
disallow_any_explicit = true
disallow_any_unimported = true
strict_bytes = true
strict_equality_for_none = true
show_error_codes = true
show_error_code_links = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "exhaustive-match",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --timeout=30 --cov=skills/create-mlops-project/scripts --cov-report=term-missing --cov-fail-under=90"
markers = [
    "contract: generated-project contract tests without external services",
    "databricks_contract: offline Databricks structure and bundle contract tests",
    "external: checks that require explicitly authorized external infrastructure",
    "integration: local multi-component tests",
    "monitoring_contract: production monitoring workflow contract tests",
]

[tool.coverage.run]
branch = true
source = ["skills/create-mlops-project/scripts"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = ["skills/create-mlops-project/scripts/validate_project.py"]
pytest_add_cli_args_test_selection = [
    "tests/test_contract_matrix.py",
    "tests/test_properties.py",
    "tests/test_validate_project.py",
    "tests/test_validator_edges.py",
]
pytest_add_cli_args = [
    "--no-cov",
    "-q",
]
