name: 01 - Code quality and package validation

on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    - cron: "19 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce dev-first pull requests
        env:
          ACTOR: ${{ github.actor }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            exit 0
          fi
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" != "dev" ]]; then
            echo "Pull requests into main must come from dev."
            exit 1
          fi
          if [[ "$BASE_REF" != "dev" && "$BASE_REF" != "main" ]]; then
            echo "Pull requests must target dev or a controlled dev-to-main promotion."
            exit 1
          fi
          if [[ "$ACTOR" == "dependabot[bot]" && "$BASE_REF" != "dev" ]]; then
            echo "Dependabot pull requests must target dev."
            exit 1
          fi

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.15"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv lock --check
      - run: uv run ruff check . --output-format=github
      - run: uv run ruff format --check .
      - run: uv run python "${{ github.workspace }}/skills/create-mlops-project/scripts/validate_project.py" --help

  type-check:
    name: type-check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.15"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: mkdir -p reports
      - run: >-
          uv run mypy
          --no-incremental
          --python-version ${{ matrix.python-version }}
          --junit-xml reports/mypy-${{ matrix.python-version }}.xml
          --junit-format per_file
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: mypy-report-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: error

  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.15"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: >-
          uv run pytest
          --junitxml=reports/junit-${{ runner.os }}-${{ matrix.python-version }}.xml
          --cov-report=xml:reports/coverage-${{ runner.os }}-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: test-reports-${{ runner.os }}-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.15"
          enable-cache: true
      - run: uv build
      - run: uv venv .package-venv
      - run: uv pip install --python .package-venv/bin/python dist/*.whl
      - run: .package-venv/bin/python -c "from scripts.validate_project import PROFILES; assert len(PROFILES) == 3"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  mutation-analysis:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.15"
          enable-cache: true
      - run: uv sync --locked --dev --group mutation
      - run: uv run --group mutation mutmut run
      - if: ${{ always() }}
        run: uv run --group mutation mutmut results

  quality:
    if: ${{ always() }}
    needs: [branch-policy, static-analysis, type-check, tests, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job
        env:
          BRANCH_RESULT: ${{ needs.branch-policy.result }}
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          TYPE_RESULT: ${{ needs.type-check.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: >-
          test "$BRANCH_RESULT $STATIC_RESULT $TYPE_RESULT $TEST_RESULT $PACKAGE_RESULT"
          = "success success success success success"
