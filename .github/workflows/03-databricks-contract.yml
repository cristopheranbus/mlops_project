name: 03 - Databricks bundle validation and deployment contract

on:
  pull_request:
    paths:
      - "skills/create-mlops-project/**"
      - "tests/**"
      - ".github/workflows/03-databricks-contract.yml"
  push:
    branches: [main]
    paths:
      - "skills/create-mlops-project/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: databricks-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.15"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run pytest -m databricks_contract --no-cov

