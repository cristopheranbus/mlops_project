name: 04 - Production model monitoring contract

on:
  push:
    branches: [main]
    paths:
      - "skills/create-mlops-project/**"
      - "tests/**"
  schedule:
    - cron: "41 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoring-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitoring-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.15"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run pytest -m monitoring_contract --no-cov

